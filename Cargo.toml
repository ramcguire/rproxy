[package]
name = "rproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.12"
memchr = "2.8"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
smallvec = "1.15"
phf = { version = "0.13", features = ["macros"] }
